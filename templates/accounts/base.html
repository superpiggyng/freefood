<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FreeFood{% endblock %}</title>
    <style>
        :root {
            --green-50: #f4fff7;
            --green-100: #e8f9ee;
            --green-200: #d4f4df;
            --green-300: #bfead1;
            --green-400: #88d2a2;
            --green-500: #2d9c63;
            --green-600: #228653;
            --green-700: #1b6d45;
            --green-800: #184f36;
            --green-900: #163b2d;
            --olive: #d4d7a4;
            --sand: #f5ebd9;
            --ash: #edf3ee;
            --card: rgba(255,255,255,0.75);
            --text: #17362b;
            --muted: #4a6257;
            --shadow: rgba(28, 78, 45, 0.14);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: Inter, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(170, 230, 190, 0.42), transparent 26%),
                linear-gradient(135deg, #f3fff7 0%, #eafaf0 24%, #dff2e7 48%, #ecfff2 100%);
            color: var(--text);
        }

        .shell {
            max-width: 1240px;
            margin: 0 auto;
            padding: 22px 24px 60px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #2d9c63, #1a6f46);
            color: white;
            box-shadow: 0 18px 30px rgba(24, 86, 57, 0.22);
            font-size: 1.1rem;
        }

        .brand-name {
            font-size: 1.8rem;
            color: var(--green-900);
            letter-spacing: -0.06em;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav a {
            text-decoration: none;
            color: var(--green-900);
            font-weight: 600;
            font-size: 0.92rem;
        }

        .primary-btn, .secondary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 999px;
            padding: 13px 22px;
            font-size: 0.96rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--green-500), var(--green-700));
            color: white;
            box-shadow: 0 16px 30px rgba(35, 117, 76, 0.24);
        }

        .secondary-btn {
            background: rgba(255,255,255,0.5);
            color: var(--green-900);
            border: 1px solid rgba(17, 65, 41, 0.08);
        }

        .primary-btn:hover, .secondary-btn:hover {
            transform: translateY(-1px);
        }

        .hero {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 30px;
            align-items: center;
            padding: 18px 0 26px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(54, 165, 96, 0.10);
            color: var(--green-700);
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .title {
            margin: 18px 0 18px;
            font-size: clamp(3rem, 6vw, 5.2rem);
            line-height: 0.94;
            letter-spacing: -0.08em;
            font-weight: 900;
            color: var(--green-900);
        }

        .lead {
            max-width: 620px;
            margin: 0 0 24px;
            font-size: 1.12rem;
            line-height: 1.7;
            color: var(--muted);
        }

        .cta-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }

        .stats {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            padding-top: 6px;
        }

        .stat {
            min-width: 120px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .stat strong {
            display: block;
            font-size: 1.7rem;
            line-height: 1.1;
            color: var(--green-900);
            letter-spacing: -0.06em;
        }

        .visual-panel {
            position: relative;
            min-height: 560px;
            background: linear-gradient(180deg, rgba(255,255,255,0.54), rgba(255,255,255,0.32));
            border: 1px solid rgba(16, 76, 44, 0.08);
            border-radius: 28px;
            box-shadow: 0 26px 80px var(--shadow);
            overflow: hidden;
            padding: 24px;
        }

        .visual-panel::before {
            content: "";
            position: absolute;
            inset: 10px 10px auto auto;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(121, 208, 149, 0.18), transparent 62%);
            border-radius: 50%;
        }

        .produce-bag {
            position: absolute;
            right: 60px;
            bottom: 38px;
            width: 290px;
            height: 360px;
            border-radius: 30px 30px 40px 40px;
            background: linear-gradient(160deg, #d0a35b 0%, #b78035 32%, #8f5c25 100%);
            box-shadow: 0 28px 60px rgba(97, 63, 23, 0.18);
            transform: rotate(-3deg);
        }

        .produce-bag::before {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            top: 10%;
            bottom: 11%;
            border-radius: 24px 24px 28px 28px;
            background: linear-gradient(180deg, rgba(121, 194, 101, 0.22), rgba(26, 98, 52, 0.08));
            border: 3px solid rgba(105, 69, 33, 0.18);
        }

        .produce-bag::after {
            content: "";
            position: absolute;
            left: 36%;
            right: 36%;
            top: -28px;
            height: 30px;
            border-radius: 18px 18px 0 0;
            background: linear-gradient(180deg, #d9b070, #ab7d38);
            box-shadow: inset 0 -8px 0 rgba(112, 80, 35, 0.12);
        }

        .produce-items {
            position: absolute;
            inset: 0;
        }

        .produce-item {
            position: absolute;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            box-shadow: inset -8px -6px 0 rgba(0,0,0,0.08);
        }

        .produce-item:nth-child(1) { left: 32%; top: 26%; background: radial-gradient(circle at 35% 35%, #f6dd68, #d8ab32 62%, #8f6a1f 100%); }
        .produce-item:nth-child(2) { left: 48%; top: 30%; background: radial-gradient(circle at 35% 35%, #f9f0bb, #d4ca5d 62%, #857b36 100%); }
        .produce-item:nth-child(3) { left: 42%; top: 42%; background: radial-gradient(circle at 35% 35%, #ffeb7d, #e6bd32 60%, #8e6d14 100%); }
        .produce-item:nth-child(4) { left: 58%; top: 46%; background: radial-gradient(circle at 35% 35%, #dded5d, #a3bf27 62%, #5c7724 100%); }
        .produce-item:nth-child(5) { left: 34%; top: 52%; background: radial-gradient(circle at 35% 35%, #7ad163, #498f35 62%, #2d5f26 100%); }
        .produce-item:nth-child(6) { left: 51%; top: 58%; background: radial-gradient(circle at 35% 35%, #65ce7d, #2d8f56 62%, #255b3d 100%); }

        .leaf {
            position: absolute;
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, #7fd58a, #218f53);
            border-radius: 58% 0 58% 0;
            transform: rotate(28deg);
            right: 82px;
            bottom: 154px;
            box-shadow: inset -8px -8px 0 rgba(20, 93, 44, 0.1);
        }

        .leaf::before {
            content: "";
            position: absolute;
            width: 2px;
            height: 84px;
            background: rgba(14, 72, 31, 0.35);
            left: 47%;
            top: 7px;
            transform: rotate(18deg);
        }

        .mini-widget {
            position: absolute;
            left: 22px;
            bottom: 20px;
            width: 190px;
            background: rgba(255,255,255,0.76);
            border: 1px solid rgba(26, 109, 69, 0.08);
            border-radius: 20px;
            box-shadow: 0 18px 30px rgba(23, 53, 37, 0.08);
            padding: 16px 18px;
        }

        .mini-widget .row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .mini-widget strong {
            color: var(--green-900);
            font-size: 1.8rem;
            letter-spacing: -0.08em;
        }

        .section-shell {
            margin-top: 22px;
            background: rgba(255,255,255,0.38);
            border: 1px solid rgba(16, 76, 44, 0.06);
            border-radius: 28px;
            padding: 26px;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            margin-top: 18px;
        }

        .feature-box {
            background: rgba(255,255,255,0.65);
            border: 1px solid rgba(16, 76, 44, 0.06);
            border-radius: 20px;
            padding: 18px;
            min-height: 124px;
        }

        .feature-box .icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: rgba(45, 156, 99, 0.10);
            margin-bottom: 14px;
            font-size: 1.2rem;
        }

        .feature-box strong {
            display: block;
            font-size: 1.08rem;
            margin-bottom: 8px;
            color: var(--green-900);
        }

        .feature-box span {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .badge {
            display: inline-block;
            background: rgba(42, 157, 99, 0.12);
            color: var(--green-700);
            border-radius: 999px;
            font-weight: 700;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .form-wrap {
            padding: 28px 0 40px;
        }

        form {
            display: grid;
            gap: 18px;
            background: rgba(255,255,255,0.72);
            border-radius: 28px;
            border: 1px solid rgba(31,119,72,0.10);
            box-shadow: 0 22px 56px rgba(16, 67, 44, 0.08);
            padding: 28px;
        }

        .two-col {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--green-900);
        }

        .field input, .field select, .field textarea {
            width: 100%;
            border: 1px solid rgba(20,70,45,0.15);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 1rem;
            background: rgba(255,255,255,0.92);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-weight: 600;
        }

        .checkbox-row input {
            width: 16px;
            height: 16px;
        }

        .role-choice {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 12px;
        }

        .role-card {
            display: block;
            background: rgba(255,255,255,0.74);
            border: 1px solid rgba(20,70,45,0.10);
            border-radius: 22px;
            padding: 22px 18px;
            text-decoration: none;
            color: var(--text);
            text-align: center;
            font-weight: 700;
        }

        .role-card strong {
            display: block;
            font-size: 1.15rem;
            margin-bottom: 8px;
        }

        .role-card span {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .alert {
            background: rgba(51, 158, 93, 0.12);
            border: 1px solid rgba(42, 157, 99, 0.2);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--green-900);
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .hero, .section-grid, .two-col, .role-choice {
                grid-template-columns: 1fr;
            }
            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .visual-panel {
                min-height: 480px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
